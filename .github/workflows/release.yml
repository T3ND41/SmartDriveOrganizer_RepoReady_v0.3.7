name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Release gate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install build and content dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[content,build]"
      - name: Compile source
        run: python -m compileall -q smart_drive_organizer run.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build Windows executable and GitHub Release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[content,build]"
      - name: Build one-file Windows application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SmartDriveOrganizer
          --collect-submodules smart_drive_organizer
          --hidden-import pypdf
          --hidden-import openpyxl
          --hidden-import pptx
          --add-data "config;config"
          --add-data "smart_drive_organizer/assets;smart_drive_organizer/assets"
          run.py
      - name: Stage release payload
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'dist/SmartDriveOrganizer.exe' $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'LICENSE.txt' $stage
          Set-Content -Path (Join-Path $stage 'VERSION.txt') -Value '${{ github.ref_name }}' -Encoding utf8
          $zip = Join-Path $PWD 'SmartDriveOrganizer-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $PWD 'SHA256SUMS.txt') -Value "$hash  SmartDriveOrganizer-windows-x64.zip" -Encoding ascii
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' `
            'SmartDriveOrganizer-windows-x64.zip' `
            'SHA256SUMS.txt' `
            --title 'Smart Drive Organizer ${{ github.ref_name }}' `
            --generate-notes
