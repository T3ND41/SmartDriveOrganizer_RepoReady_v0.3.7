[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-drive-organizer"
version = "0.3.8"
description = "Local-first file organizer with optional automatic background monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Smart Drive Organizer contributors"}]
dependencies = []

[project.optional-dependencies]
content = ["pypdf>=5.0.0", "openpyxl>=3.1.0", "python-pptx>=1.0.0"]
build = ["pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
include = ["smart_drive_organizer*"]
