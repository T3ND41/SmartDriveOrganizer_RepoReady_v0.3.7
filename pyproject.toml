[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-drive-organizer"
version = "0.7.0"
description = "Local-first deep search, file discovery, learning and safe file organization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Smart Drive Organizer contributors"}]
dependencies = []

[project.optional-dependencies]
content = ["pypdf>=5.0.0", "openpyxl>=3.1.0", "python-pptx>=1.0.0", "extract-msg>=0.48", "pywin32>=306; platform_system == \"Windows\"", "send2trash>=1.8"]
build = ["pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
include = ["smart_drive_organizer*"]

[tool.setuptools.package-data]
smart_drive_organizer = ["assets/*.png", "assets/icons/dark/*.png"]
