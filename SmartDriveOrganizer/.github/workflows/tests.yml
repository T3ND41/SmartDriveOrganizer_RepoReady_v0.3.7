name: Test Smart Drive Organizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional document readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[content]"
      - name: Compile Python source
        run: python -m compileall -q smart_drive_organizer run.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
